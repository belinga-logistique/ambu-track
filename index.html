<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ambu Track</title>
<meta name="description" content="Suivi opérationnel des ambulances — Fortescue Belinga">
<meta name="theme-color" content="#0f1e2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&display=swap">
<style>
/* Palette A « Secours Belinga » : bleu = action, rouge = urgence uniquement */
:root{
  --prim:#0b62a4;--prim-f:#084d82;--prim-c:#e4eff9;--sur-prim:#ffffff;
  --rouge:#d42b1f;--rouge-f:#a91f15;--rouge-c:#fdeceb;--nuit:#0f1e2e;--nuit-2:#17324d;
  --fond:#f2f5f9;--carte:#ffffff;--texte:#0f1e2e;--doux:#44546a;--bord:#dbe3ec;--survol:#f5f8fb;
  --ok:#0f7a4f;--ok-f:#dcf2e7;--warn:#a65300;--warn-f:#ffedd5;--bad:#d42b1f;--bad-f:#fde6e4;
  --info:#0b62a4;--info-f:#e4eff9;--mute:#44546a;--mute-f:#e9eef4;
  --ombre:0 1px 2px rgba(15,30,46,.06),0 4px 14px rgba(15,30,46,.06);
  --f-titre:"Archivo","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --r:14px;--haut:58px;--bas:66px;--epais:1px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme]){
  --prim:#5aa9e6;--prim-f:#7dbdee;--prim-c:#132f48;--sur-prim:#07131f;
  --fond:#0b131c;--carte:#14202d;--texte:#e6edf5;--doux:#a3b3c5;--bord:#283a4e;--survol:#1a2938;
  --ok:#5fd19b;--ok-f:#133326;--warn:#f2b25c;--warn-f:#3a2a12;--bad:#ff8a80;--bad-f:#3d1a18;
  --info:#5aa9e6;--info-f:#132f48;--mute:#a3b3c5;--mute-f:#1f2c3a;--rouge-c:#3d1a18;--nuit:#08111a;--nuit-2:#102435;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --prim:#5aa9e6;--prim-f:#7dbdee;--prim-c:#132f48;--sur-prim:#07131f;
  --fond:#0b131c;--carte:#14202d;--texte:#e6edf5;--doux:#a3b3c5;--bord:#283a4e;--survol:#1a2938;
  --ok:#5fd19b;--ok-f:#133326;--warn:#f2b25c;--warn-f:#3a2a12;--bad:#ff8a80;--bad-f:#3d1a18;
  --info:#5aa9e6;--info-f:#132f48;--mute:#a3b3c5;--mute-f:#1f2c3a;--rouge-c:#3d1a18;--nuit:#08111a;--nuit-2:#102435;
  color-scheme:dark;
}
/* Mode « Plein soleil » : contraste maximal pour la lecture en extérieur */
:root[data-theme="soleil"]{
  --prim:#004a87;--prim-f:#003664;--prim-c:#dcebf8;--sur-prim:#ffffff;
  --fond:#ffffff;--carte:#ffffff;--texte:#000000;--doux:#1d2733;--bord:#5d6b7a;--survol:#eef2f6;
  --ok:#005c35;--ok-f:#ccefdc;--warn:#7a3d00;--warn-f:#ffe2bf;--bad:#b00d00;--bad-f:#ffd9d4;
  --info:#004a87;--info-f:#dcebf8;--mute:#1d2733;--mute-f:#e3e8ee;--rouge:#c40f00;--rouge-c:#ffd9d4;--nuit:#000000;--nuit-2:#000000;
  --ombre:none;--epais:2px;color-scheme:light;
}
:root[data-theme="soleil"] body{font-size:16.5px}
:root[data-theme="soleil"] .carte,:root[data-theme="soleil"] .ligne,:root[data-theme="soleil"] .kpi,:root[data-theme="soleil"] .ar,
:root[data-theme="soleil"] input,:root[data-theme="soleil"] select,:root[data-theme="soleil"] textarea,:root[data-theme="soleil"] .btn{border-width:2px}
:root[data-theme="soleil"] .chip{border:1.5px solid currentColor}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--texte);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden}
a{color:var(--info)}
h1,h2,h3{font-family:var(--f-titre);letter-spacing:-.01em;text-wrap:balance}
h1{font-size:1.5rem;font-weight:800;margin:0 0 .2rem}h2{font-size:1.1rem;font-weight:700;margin:0 0 .6rem}h3{font-size:.98rem;font-weight:700;margin:.2rem 0 .5rem}
.cache{display:none!important}
.barre{position:fixed;top:0;left:0;right:0;height:var(--haut);display:flex;align-items:center;gap:10px;padding:0 12px;
  padding-top:env(safe-area-inset-top);background:linear-gradient(90deg,var(--nuit),var(--nuit-2));color:#fff;z-index:30}
.logo{display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none;font:800 1.08rem/1 var(--f-titre);letter-spacing:.1px}
.logo b{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--rouge)}
.barre .esp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;
  border-radius:999px;padding:5px 11px;font-size:.8rem;cursor:pointer;white-space:nowrap}
.pill i{width:9px;height:9px;border-radius:50%;background:#6fd39a;display:inline-block}
.pill.hors i{background:#f0b354}.pill.err i{background:#ff6b81}.pill.enc i{background:#79b2f5;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.nav{position:fixed;top:var(--haut);bottom:0;left:0;width:232px;background:var(--carte);border-right:1px solid var(--bord);padding:12px 10px;overflow:auto;z-index:20}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--texte);text-decoration:none;font-weight:500;margin-bottom:2px}
.nav a:hover{background:var(--survol)}.nav a.actif{background:var(--prim-c);color:var(--prim);font-weight:650;box-shadow:inset 3px 0 0 var(--prim)}
.nav .sep{height:1px;background:var(--bord);margin:10px 4px}
.nav .qui{padding:8px 12px;font-size:.82rem;color:var(--doux)}
main{padding:calc(var(--haut) + 16px) 16px 32px 248px;max-width:1240px}
.bas{display:none}
.menu-btn{display:none;background:none;border:0;color:#fff;padding:6px;cursor:pointer}
@media (max-width:899px){
  .nav{transform:translateX(-105%);transition:transform .2s;width:82%;max-width:300px;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .nav.ouvert{transform:none}
  .menu-btn{display:block}
  main{padding:calc(var(--haut) + 12px) 12px calc(var(--bas) + 24px) 12px}
  .bas{display:flex;position:fixed;bottom:0;left:0;right:0;height:calc(var(--bas) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
    background:var(--carte);border-top:1px solid var(--bord);z-index:25}
  .bas a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--doux);text-decoration:none;font-size:.72rem;font-weight:550}
  .bas a.actif{color:var(--prim)}
  .bas a.cta span.rond{background:var(--rouge);color:#fff;border-radius:14px;padding:6px 14px}
}
.voile{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:19;display:none}.voile.ouvert{display:block}
.tete{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tete .titre{flex:1;min-width:200px}.tete p{margin:0;color:var(--doux)}
.retour{display:inline-flex;align-items:center;gap:4px;color:var(--doux);text-decoration:none;font-size:.88rem;margin-bottom:6px}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:var(--r);padding:16px;box-shadow:var(--ombre);margin-bottom:14px}
.carte.plate{box-shadow:none}
.grille{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:899px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g2.r1,.g3.r1{grid-template-columns:1fr}}
.kpi{background:var(--carte);border:1px solid var(--bord);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--texte);display:block;box-shadow:var(--ombre)}
.kpi .v{font:800 1.75rem/1.1 var(--f-titre);font-variant-numeric:tabular-nums}
.kpi .l{font-size:.82rem;color:var(--doux);margin-top:3px}
.kpi.bad .v{color:var(--bad)}.kpi.warn .v{color:var(--warn)}.kpi.ok .v{color:var(--ok)}
.mission-cours{border:0;background:linear-gradient(135deg,var(--prim),var(--prim-f));color:var(--sur-prim);display:flex;flex-direction:column;gap:12px}
.mission-cours .mc-haut{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.86rem;opacity:.95}
.mission-cours .mc-haut b{font:700 1rem/1.2 var(--f-titre)}
.mc-route{display:flex;align-items:center;gap:10px;font:700 1.05rem/1.25 var(--f-titre)}
.mc-route span{min-width:0;overflow-wrap:anywhere}
.mc-route i{flex:1;min-width:30px;height:2px;background:repeating-linear-gradient(90deg,currentColor 0 7px,transparent 7px 12px);opacity:.7}
.mc-btns{display:flex;gap:8px}.mc-btns .btn{flex:1}
.mission-cours .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:inherit}
.mission-cours .btn.p{background:var(--carte);border-color:var(--carte);color:var(--prim)}
.titre-ligne{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.titre-ligne h2{margin:0}
.titre-section{margin:6px 2px 10px}
.bande-kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.bande-kpi .kpi{padding:12px}.bande-kpi .kpi .v{font-size:1.5rem}.bande-kpi .kpi .v small{font-size:.85rem;color:var(--doux);font-weight:600}
@media (max-width:560px){.bande-kpi{gap:8px}.bande-kpi .kpi{padding:10px 8px}.bande-kpi .kpi .v{font-size:1.25rem}.bande-kpi .kpi .l{font-size:.7rem;line-height:1.25}}
details.autres-kpi,details.plus-alertes{margin-bottom:12px}
details summary{cursor:pointer;color:var(--info);font-weight:600;font-size:.9rem;padding:6px 2px;list-style-position:inside}
details.plus-alertes summary{margin-bottom:6px}
.vide .btn{margin-top:12px}
.actions-rapides{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (max-width:700px){.actions-rapides{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ar{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--r);text-decoration:none;color:var(--texte);background:var(--carte);border:1px solid var(--bord);font-weight:650;box-shadow:var(--ombre);min-height:92px}
.ar .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--info-f);color:var(--info)}
.ar.prim .ico{background:var(--prim);color:var(--sur-prim)}.ar.rouge .ico{background:var(--bad-f);color:var(--bad)}.ar.orange .ico{background:var(--warn-f);color:var(--warn)}.ar.vert .ico{background:var(--ok-f);color:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--bord);background:var(--carte);color:var(--texte);
  border-radius:10px;padding:10px 15px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;min-height:44px}
.btn:hover{background:var(--survol)}
.btn.p{background:var(--prim);border-color:var(--prim);color:var(--sur-prim)}.btn.p:hover{background:var(--prim-f);border-color:var(--prim-f)}
.btn.urgence{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:active{transform:scale(.98)}
.btn.s{background:var(--nuit);border-color:var(--nuit);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.petit{min-height:34px;padding:6px 11px;font-size:.86rem}
.btn.large{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.barre-actions{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;white-space:nowrap;background:var(--mute-f);color:var(--mute)}
.chip.ok{background:var(--ok-f);color:var(--ok)}.chip.warn{background:var(--warn-f);color:var(--warn)}.chip.bad{background:var(--bad-f);color:var(--bad)}.chip.info{background:var(--info-f);color:var(--info)}
.liste{display:flex;flex-direction:column;gap:8px}
.ligne{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--carte);border:1px solid var(--bord);border-radius:var(--r);text-decoration:none;color:var(--texte)}
.ligne:hover{background:var(--survol)}
.ligne .corps{flex:1;min-width:0}.ligne .t{font-weight:650;overflow:hidden;text-overflow:ellipsis}.ligne .s{color:var(--doux);font-size:.85rem}
.ligne .droite{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.alerte{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--info-f);color:var(--texte);text-decoration:none;margin-bottom:6px;border-left:4px solid var(--info)}
.alerte.critique{background:var(--bad-f);border-color:var(--bad)}.alerte.haute{background:var(--warn-f);border-color:var(--warn)}
.alerte b{display:block}.alerte small{color:var(--doux)}
.bandeau{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:.9rem;background:var(--info-f);color:var(--texte);border:1px solid transparent}
.bandeau.warn{background:var(--warn-f)}.bandeau.bad{background:var(--bad-f);border-color:var(--bad)}.bandeau.ok{background:var(--ok-f)}
form .champ,.champ{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
label.lib,.lib{font-weight:600;font-size:.88rem}
.lib .obl{color:var(--bad)}
.aide{font-size:.8rem;color:var(--doux)}
input,select,textarea{font:inherit;color:var(--texte);background:var(--carte);border:1px solid var(--bord);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--info);outline-offset:0;border-color:var(--info)}
.invalide{border-color:var(--bad)!important;background:var(--bad-f)!important}
.case{display:flex;align-items:flex-start;gap:9px;font-size:.92rem;cursor:pointer}
.case input{width:20px;height:20px;min-height:0;margin-top:2px;flex:none}
.onglets{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none}
.onglets button,.onglets a{flex:none;border:1px solid var(--bord);background:var(--carte);color:var(--texte);border-radius:999px;padding:7px 14px;font:inherit;font-size:.88rem;font-weight:600;cursor:pointer;text-decoration:none}
.onglets .actif{background:var(--nuit);color:#fff;border-color:var(--nuit)}
.filtres{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filtres>*{flex:1;min-width:140px}
.def{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:6px 12px;font-size:.92rem}
.def dt{color:var(--doux)}.def dd{margin:0;font-weight:550;overflow-wrap:anywhere}
.calc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.calc{grid-template-columns:repeat(2,minmax(0,1fr))}}
.calc div{background:var(--survol);border-radius:10px;padding:10px 12px}
.calc .v{font:800 1.35rem/1.2 var(--f-titre);font-variant-numeric:tabular-nums}.calc .l{font-size:.78rem;color:var(--doux)}
.calc .reel{background:var(--ok-f)}.calc .estim{background:var(--info-f);border:1px dashed var(--info)}
.seg{display:inline-flex;border:1px solid var(--bord);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--carte);color:var(--texte);font:inherit;font-weight:700;padding:8px 12px;min-width:48px;min-height:42px;cursor:pointer;border-left:1px solid var(--bord)}
.seg button:first-child{border-left:0}
.seg button.on[data-v="c"]{background:var(--ok);color:#fff}.seg button.on[data-v="nc"]{background:var(--bad);color:#fff}.seg button.on[data-v="na"]{background:var(--mute);color:#fff}
.seg.choix button.on{background:var(--nuit);color:#fff}
.etapes-ctrl{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:4px;scrollbar-width:none}
.etapes-ctrl button{flex:none;display:flex;align-items:center;gap:7px;border:var(--epais) solid var(--bord);background:var(--carte);color:var(--texte);border-radius:12px;padding:7px 11px;font:600 .84rem/1.1 inherit;cursor:pointer}
.etapes-ctrl b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--mute-f);font-size:.75rem}
.etapes-ctrl em{font-style:normal;font-size:.72rem;color:var(--doux);font-variant-numeric:tabular-nums}
.etapes-ctrl button.on{border-color:var(--prim);box-shadow:0 0 0 2px var(--prim-c)}.etapes-ctrl button.on b{background:var(--prim);color:var(--sur-prim)}
.etapes-ctrl button.fait b{background:var(--ok);color:#fff}.etapes-ctrl button.fait.nc b{background:var(--warn)}
.colle-ligne{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:560px){.colle-ligne>div{flex-basis:100%!important}.colle-ligne .btn{flex:1}}
.point.repere{background:var(--prim-c);border-radius:10px;transition:background .3s}
.seg button{transition:background .12s,color .12s}
.point{padding:10px 0;border-bottom:1px solid var(--bord)}
.point:last-child{border-bottom:0}
.point .haut{display:flex;align-items:center;gap:10px}
.point .nom{flex:1}
.crit{display:inline-block;font-size:.7rem;font-weight:700;color:var(--bad);border:1px solid var(--bad);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:middle}
.photos{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.photos .vign{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;background:var(--survol);border:1px solid var(--bord)}
.photos .vign img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.photos .vign button{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
.photos .vign .pdf{display:grid;place-items:center;height:100%;font-size:.75rem;font-weight:700;color:var(--doux)}
.btn-photo{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--doux);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--doux);min-height:44px}
.chrono{border-left:2px solid var(--bord);margin-left:8px;padding-left:16px}
.chrono .ev{position:relative;padding:4px 0 12px}
.chrono .ev::before{content:"";position:absolute;left:-23px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--carte);border:2px solid var(--doux)}
.chrono .ev.ok::before{border-color:var(--ok)}.chrono .ev.bad::before{border-color:var(--bad)}.chrono .ev.warn::before{border-color:var(--warn)}.chrono .ev.info::before{border-color:var(--info)}
.chrono a{color:var(--texte);text-decoration:none}
.tab{width:100%;border-collapse:collapse;font-size:.88rem}
.tab th,.tab td{padding:8px 10px;border-bottom:1px solid var(--bord);text-align:left;vertical-align:top}
.tab th{font-size:.78rem;color:var(--doux);font-weight:650;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.tab td.n,.tab th.n{text-align:right;font-variant-numeric:tabular-nums}
.tab tfoot td{font-weight:750;border-top:2px solid var(--bord)}
.defile{overflow-x:auto;-webkit-overflow-scrolling:touch}
.vide{padding:28px 16px;text-align:center;color:var(--doux)}
.carte-map{height:420px;border-radius:var(--r);overflow:hidden;border:1px solid var(--bord);z-index:1}
.carte-map.mini{height:220px}
@media (max-width:899px){.carte-map{height:58vh}}
#toasts{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bas) + 18px);z-index:90;display:flex;flex-direction:column;gap:8px;width:min(92vw,460px)}
@media (min-width:900px){#toasts{bottom:24px}}
.toast{background:var(--nuit);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:.92rem;animation:entree .22s ease-out}
.toast.bad{background:#a91f15}.toast.ok{background:#0f6b45}
@keyframes entree{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.modal{background:var(--carte);color:var(--texte);width:min(100%,640px);max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}

.modal .mtete{display:flex;align-items:center;gap:8px;margin-bottom:12px}.modal .mtete h2{flex:1;margin:0}
.fermer{border:0;background:var(--survol);color:var(--texte);border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:1.1rem}
.recherche-lieux{max-height:46vh;overflow:auto;margin-top:8px}
.recherche-lieux button{display:flex;width:100%;text-align:left;gap:8px;align-items:center;border:0;border-bottom:1px solid var(--bord);background:none;color:var(--texte);padding:11px 6px;font:inherit;cursor:pointer}
.recherche-lieux button:hover{background:var(--survol)}
.choix-lieu{display:flex;align-items:center;gap:8px;justify-content:space-between;text-align:left;width:100%;border:1px solid var(--bord);background:var(--carte);color:var(--texte);border-radius:10px;padding:10px 12px;min-height:44px;font:inherit;cursor:pointer}
.choix-lieu .vide2{color:var(--doux)}
.ecran{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(120% 90% at 0% 0%,var(--nuit-2),var(--nuit) 70%)}
.ecran .boite{background:var(--carte);color:var(--texte);width:min(100%,420px);border-radius:18px;padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.ecran .marque{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ecran .marque b{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:var(--rouge);color:#fff}
.ecran .marque h1{margin:0;font-size:1.5rem}
.pied{color:var(--doux);font-size:.8rem;margin-top:14px;text-align:center}
.maj{position:fixed;top:calc(var(--haut) + 8px);left:50%;transform:translateX(-50%);z-index:60;background:var(--info);color:#fff;border-radius:999px;padding:8px 8px 8px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.maj button{border:0;border-radius:999px;background:#fff;color:var(--info);font-weight:700;padding:6px 12px;cursor:pointer}
.legende{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--doux);margin-top:8px}
.legende i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.diff td:nth-child(2){background:var(--warn-f)}.diff td:nth-child(3){background:var(--info-f)}
.imprimer-seul{display:none}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:.82rem}
.progression{height:8px;border-radius:99px;background:var(--mute-f);overflow:hidden}
.progression i{display:block;height:100%;background:var(--ok);transition:width .2s}
.colle{position:sticky;bottom:calc(var(--bas) + 8px);z-index:5;background:var(--carte);border:1px solid var(--bord);border-radius:var(--r);padding:10px;box-shadow:0 -4px 16px rgba(0,0,0,.08)}

.choix-chauffeur{display:flex;gap:10px;align-items:center}.choix-chauffeur select{flex:1}
.lien-cond{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--texte)}
.choix-amb{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.choix-amb button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:var(--epais) solid var(--bord);background:var(--carte);color:var(--texte);border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit;text-align:left}

.km-zone:focus-within{box-shadow:0 0 0 4px var(--prim-c)}
.km-delta{min-height:28px;font-weight:650;margin-bottom:10px}.km-delta.ok{color:var(--ok)}.km-delta.bad{color:var(--bad)}.km-delta.warn{color:var(--warn)}
.puces-choix{display:flex;flex-wrap:wrap;gap:6px}
.puces-choix button,.puces-cat label{border:var(--epais) solid var(--bord);background:var(--carte);color:var(--texte);border-radius:999px;padding:7px 13px;font:600 .86rem/1 inherit;cursor:pointer}

.puces-cat{display:flex;flex-wrap:wrap;gap:6px}.puces-cat input{position:absolute;opacity:0;pointer-events:none}
.puces-cat label:has(input:checked){background:var(--prim);border-color:var(--prim);color:var(--sur-prim)}
.puces-cat label:focus-within{outline:2px solid var(--info);outline-offset:2px}
.courbe{width:100%;height:120px;display:block}
.jauge-ent{padding:10px 0;border-top:1px solid var(--bord)}.jauge-ent:first-of-type{border-top:0}
.jauge-ent .haut{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.9rem}
.barre-km{height:10px;border-radius:99px;background:var(--mute-f);overflow:hidden;margin:8px 0 4px}
.barre-km i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.barre-km.haute i{background:var(--warn)}.barre-km.critique i{background:var(--bad)}
.km-gros{font:800 1.3rem/1 var(--f-titre);font-variant-numeric:tabular-nums}
.resume-alertes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.grille-cond{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.carte-cond{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--carte);border:var(--epais) solid var(--bord);border-radius:var(--r);text-decoration:none;color:var(--texte);box-shadow:var(--ombre)}
.carte-cond .corps{flex:1;min-width:0}.carte-cond .t{font-weight:700}.carte-cond .s{font-size:.82rem;color:var(--doux)}
.carte-cond .cats{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.cat{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 6px;border-radius:6px;background:var(--nuit);color:#fff;font:800 .74rem/1 var(--f-titre)}
.badge-id{max-width:420px;border-radius:18px;overflow:hidden;background:var(--carte);border:1px solid var(--bord);box-shadow:0 10px 30px rgba(15,30,46,.15);margin:0 auto 14px}
.badge-id .bandeau{margin:0;border-radius:0;background:linear-gradient(90deg,var(--nuit),var(--nuit-2));color:#fff;display:flex;align-items:center;gap:8px;padding:10px 14px;font:800 .9rem/1 var(--f-titre);letter-spacing:.06em;text-transform:uppercase}

}

const IDB = (() => {
  let db = null;

    const r = indexedDB.open(nom, 1);

    t.oncomplete = () => ok(res); t.onerror = () => ko(t.error); t.onabort = () => ko(t.error || new Error('Stockage local plein ?'));

  const ambs = ambulancesVisibles().filter((a) => !filtreAmb || a.id === filtreAmb);
  const ids = new Set(ambs.map((a) => a.id));
  const ajout = (cat, niveau, titre, detail, href) => res.push({ cat, niveau, titre, detail, href });
  for (const x of L('ambu_signalements')) {
    if (!ids.has(x.ambulance_id) || !ouvert(x)) continue;
    if (x.type === 'accident' || x.priorite === 'critique' || x.priorite === 'haute')
      ajout('signalement', x.type === 'accident' || x.priorite === 'critique' ? 'critique' : 'haute', `${LIB.typeSig[x.type]} ${LIB.priorite[x.priorite][0].toLowerCase()} — ${amb(x.ambulance_id)?.code || ''}`, x.description, '#/signalement/' + x.id);
    if (x.echeance && x.echeance < auj) ajout('signalement', 'haute', `Action en retard — ${amb(x.ambulance_id)?.code || ''}`, `Échéance du ${fmtJ(x.echeance)} : ${x.description}`, '#/signalement/' + x.id);
  }
  for (const i of L('ambu_inspections')) if (ids.has(i.ambulance_id) && i.revue_statut === 'a_revoir')
    ajout('controle', 'haute', `Contrôle à revoir par le superviseur — ${amb(i.ambulance_id)?.code || ''}`, `${i.nb_nc || 0} NC${i.critique ? ' dont critique' : ''} · déclaré ${LIB.statutDecl[i.statut_declare]?.[0] || ''} · ${fmtDH(i.date_controle)}`, '#/controle-voir/' + i.id);
  for (const a of ambs) {
    if (a.statut === 'immobilisee') ajout('statut', 'info', `${a.code} immobilisée`, a.notes || 'Voir la fiche ambulance', '#/ambulance/' + a.id);
    const docs = documentsCourants(a.id);
    for (const t of DOCS_SUIVIS) {
      const d = docs[t];
      if (!d) { ajout('document', 'info', `${LIB.typeDoc[t]} non enregistrée — ${a.code}`, 'Ajoutez le document et sa date de validité', '#/ambulance/' + a.id + '?onglet=documents'); continue; }
      const e = etatDocument(d);
      if (e.niveau === 'critique' || e.niveau === 'haute') ajout('document', e.niveau, `${LIB.typeDoc[t]} — ${a.code}`, e.texte, '#/ambulance/' + a.id + '?onglet=documents');
    }
    for (const d of Object.values(docs)) if (!DOCS_SUIVIS.includes(d.type) && d.expiration) { const e = etatDocument(d); if (e.niveau === 'critique' || e.niveau === 'haute') ajout('document', e.niveau, `${LIB.typeDoc[d.type]} — ${a.code}`, e.texte, '#/ambulance/' + a.id + '?onglet=documents'); }
    for (const e of entretiensDus(a.id)) if (e.niveau === 'critique' || e.niveau === 'haute') ajout('entretien', e.niveau, `${e.libelle} ${e.niveau === 'critique' ? 'dépassée' : 'à prévoir'} — ${a.code}`, e.texte, '#/alertes?onglet=km');
    const m = missionEnCours(a.id);
    if (m && (Date.now() - new Date(m.debut)) > 12 * 3600000) ajout('mission', 'haute', `Mission non clôturée — ${a.code}`, `Démarrée le ${fmtDH(m.debut)}`, '#/mission/' + m.id);
  }
  if (!filtreAmb) for (const c of conducteursVisibles()) {
    const p = etatValidite(c.permis_expiration, s.rappel_permis_jours);
    if (p.niveau === 'critique' || p.niveau === 'haute') ajout('permis', p.niveau, `Permis de conduire — ${nomCond(c)}`, p.texte, '#/chauffeur/' + c.id);
    else if (!c.permis_numero || !c.permis_expiration) ajout('permis', 'info', `Permis non renseigné — ${nomCond(c)}`, 'Complétez le numéro, les catégories et la date de validité', '#/chauffeur/' + c.id);
    for (const [champ, lib] of [['aptitude_expiration', 'Aptitude médicale'], ['secourisme_expiration', 'Formation secourisme']]) {
      if (!c[champ]) continue; const e = etatValidite(c[champ], s.rappel_permis_jours);
      if (e.niveau === 'critique' || e.niveau === 'haute') ajout('permis', e.niveau, `${lib} — ${nomCond(c)}`, e.texte, '#/chauffeur/' + c.id);
    }
  }
  const nErr = S.out.filter((o) => o.statut !== 'attente').length;
  if (nErr) ajout('sync', 'haute', `${nErr} saisie(s) non synchronisée(s) à traiter`, 'Erreur ou conflit : ouvrez l’écran Synchronisation', '#/sync');
  if (peut.sup()) { const nc = L('ambu_conflits').filter((c) => c.statut === 'ouvert').length; if (nc) ajout('sync', 'haute', `${nc} conflit(s) de modification à arbitrer`, 'Deux personnes ont modifié la même fiche', '#/sync'); }
  const rang = { critique: 0, haute: 1, info: 2 };
  return res.sort((a, b) => rang[a.niveau] - rang[b.niveau]);
}

/* ----------------------------------------------------------------- Interface : messages et fenêtres */
function toast(msg, type = '') {
  const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg; $('#toasts').appendChild(t);
  while ($('#toasts').children.length > 3) $('#toasts').firstElementChild.remove();
  setTimeout(() => t.remove(), type === 'bad' ? 6500 : 3500);
}
function modale(titre, html, init, aLaFermeture) {
  const fond = document.createElement('div'); fond.className = 'modal-fond';
  fond.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(titre)}"><div class="mtete"><h2>${esc(titre)}</h2><button class="fermer" aria-label="Fermer">✕</button></div><div class="mcorps">${html}</div></div>`;
  $('#modales').appendChild(fond);
  let ferme = false;
  const fermer = () => { if (ferme) return; ferme = true; fond.remove(); if (aLaFermeture) aLaFermeture(); };
  fond.addEventListener('click', (e) => { if (e.target === fond) fermer(); });
  $('.fermer', fond).onclick = fermer;
  if (init) init($('.mcorps', fond), fermer);
  return fermer;
}
const confirmer = (msg, { ok = 'Confirmer', danger = false } = {}) => new Promise((res) => {
  let rep = false;
  modale('Confirmation', `<p>${esc(msg)}</p><div class="barre-actions" style="justify-content:flex-end"><button class="btn" data-x>Annuler</button><button class="btn ${danger ? 'danger' : 'p'}" data-ok>${esc(ok)}</button></div>`, (el, fermer) => {
    $('[data-x]', el).onclick = () => fermer(); $('[data-ok]', el).onclick = () => { rep = true; fermer(); };
  }, () => res(rep));
});
function lireForm(form) {
  const o = {};
  for (const el of form.elements) {
    if (!el.name || el.disabled) continue;
    if (el.type === 'checkbox') o[el.name] = el.checked;
    else if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; }
    else if (el.type === 'number') o[el.name] = nombre(el.value);
    else o[el.name] = el.value.trim();
  }
  return o;
}
const options = (liste, val, vide) => (vide !== undefined ? `<option value="">${esc(vide)}</option>` : '') +
  liste.map((x) => { const [v, l] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(v)}"${String(v) === String(val ?? '') ? ' selected' : ''}>${esc(l)}</option>`; }).join('');
const optAmb = (val, filtre = () => true) => ambulancesVisibles().filter(filtre).map((a) => [a.id, `${a.code} · ${a.immatriculation}${a.modele ? ' · ' + a.modele : ''}`]);
function erreurChamp(form, nom, msg) {
  const el = form.querySelector(`[name="${nom}"]`) || form.querySelector(`[data-champ="${nom}"]`);
  if (el) el.dispatchEvent(new CustomEvent('montrer', { bubbles: true }));
  if (el) { el.classList.add('invalide'); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.addEventListener('input', () => el.classList.remove('invalide'), { once: true }); }
  toast(msg, 'bad'); return false;
}

/* ----------------------------------------------------------------- Photos et pièces jointes */
const PHOTOS = {};   // clé de champ -> [{ id, donnees, nom, mime }]
function champPhotos(cle, existants = [], { pdf = false, etiquette = 'Ajouter une photo' } = {}) {
  PHOTOS[cle] = existants.map((id) => ({ id, existant: true }));
  return `<div class="photos" data-photos="${esc(cle)}"${pdf ? ' data-pdf="1"' : ''}></div>`;
}
function dessinerPhotos(el) {
  const cle = el.dataset.photos; const liste = PHOTOS[cle] || [];
  el.innerHTML = liste.map((p, i) => `<div class="vign">${p.mime === 'application/pdf' ? '<div class="pdf">PDF</div>' : `<img data-fid="${esc(p.id)}" alt="Photo ${i + 1}">`}${p.existant ? '' : `<button type="button" data-suppr="${i}" aria-label="Retirer">✕</button>`}</div>`).join('')
    + `<label class="btn-photo">${ic('photo', 18)} ${liste.length ? 'Ajouter' : 'Ajouter une photo'}<input type="file" accept="image/*${el.dataset.pdf ? ',application/pdf' : ''}" multiple hidden></label>`;
  for (const p of liste) if (p.donnees) { const img = el.querySelector(`img[data-fid="${p.id}"]`); if (img) img.src = p.donnees; }
  hydraterImages(el);
  $$('[data-suppr]', el).forEach((b) => b.onclick = () => { liste.splice(Number(b.dataset.suppr), 1); dessinerPhotos(el); });
  $('input[type=file]', el).onchange = async (e) => {
    for (const f of e.target.files) {
      try {
        const donnees = f.type === 'application/pdf' ? await lirePdf(f) : await compresser(f);
        liste.push({ id: uuid(), donnees, nom: f.name, mime: f.type === 'application/pdf' ? 'application/pdf' : 'image/jpeg' });
      } catch (err) { toast(err.message, 'bad'); }
    }
    dessinerPhotos(el);
  };
}
function lierPhotos(racine) { $$('[data-photos]', racine).forEach(dessinerPhotos); }
function lirePdf(f) {
  return new Promise((ok, ko) => { if (f.size > 1400000) return ko(new Error('PDF trop lourd (1,4 Mo maximum). Prenez plutôt une photo du document.'));
    const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => ko(new Error('Lecture du fichier impossible')); r.readAsDataURL(f); });
}
function compresser(f, max = 1280, q = 0.72) {
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(f); const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error('Image illisible')); };
    img.src = url;
  });
}
/** Enregistre les nouvelles photos d'un champ et renvoie la liste complète des identifiants */
async function sauverPhotos(cle, ambulance_id, objet, site_id = null) {
  const ids = [];
  for (const p of PHOTOS[cle] || []) {
    if (!p.existant) {
      await IDB.ecrire('fichiers', { k: p.id, donnees: p.donnees });
      await enregistrer('ambu_fichiers', p.id, { ambulance_id: ambulance_id || null, ...(ambulance_id ? {} : { site_id }), objet, nom: p.nom || 'photo.jpg', mime: p.mime, taille: p.donnees.length, donnees: p.donnees }, { sansSync: true });
      p.existant = true;
    }
    ids.push(p.id);
  }
  return ids;
}
async function donneesFichier(id) {
  const loc = await IDB.lire('fichiers', id); if (loc) return loc.donnees;
  const o = S.out.find((x) => x.table === 'ambu_fichiers' && x.id === id); if (o?.data?.donnees) return o.data.donnees;
  if (!navigator.onLine) return null;
  try { const f = await rpc('ambu_fichier', { p_id: id }); if (f?.donnees) { await IDB.ecrire('fichiers', { k: id, donnees: f.donnees }); return f.donnees; } } catch { /* hors ligne */ }
  return null;
}
function hydraterImages(racine) {
  $$('img[data-fid]', racine).forEach(async (img) => {
    if (img.src) return;
    const d = await donneesFichier(img.dataset.fid);
    if (d) { if (d.startsWith('data:application/pdf')) { img.replaceWith(Object.assign(document.createElement('div'), { className: 'pdf', textContent: 'PDF' })); return; } img.src = d; }
    else { img.alt = 'Photo non disponible hors ligne'; img.style.opacity = .3; }
    img.onclick = () => d && modale('Photo', `<img src="${d}" style="width:100%;border-radius:10px" alt="">`);
  });
}
const vignettes = (ids) => (ids || []).length ? `<div class="photos">${ids.map((id) => `<div class="vign"><img data-fid="${esc(id)}" alt="Photo"></div>`).join('')}</div>` : '<span class="aide">Aucune</span>';

/* ----------------------------------------------------------------- Accès serveur (Supabase) */
const lireSession = () => { try { return JSON.parse(localStorage.getItem('ambu.session')); } catch { return null; } };
const ecrireSession = (s) => { S.session = s; if (s) localStorage.setItem('ambu.session', JSON.stringify(s)); else localStorage.removeItem('ambu.session'); };
const erreurReseau = () => Object.assign(new Error('Réseau indisponible — vos saisies restent enregistrées sur l’appareil.'), { reseau: true });
async function requete(chemin, { methode = 'GET', corps, jeton, delai = 25000 } = {}) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), delai);
  let r;
  try {
    r = await fetch(CONFIG.SUPABASE_URL + chemin, { method: methode, signal: ctl.signal,
      headers: { apikey: CONFIG.ANON, 'Content-Type': 'application/json', Authorization: 'Bearer ' + (jeton || CONFIG.ANON) },
      body: corps === undefined ? undefined : JSON.stringify(corps) });
  } catch { throw erreurReseau(); } finally { clearTimeout(t); }
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch { j = { message: txt }; }
  if (!r.ok) {
    const msg = j?.erreur || j?.message || j?.msg || j?.error_description || `Erreur serveur (${r.status})`;
    throw Object.assign(new Error(msg), { status: r.status, code: j?.code || j?.error_code });
  }
  return j;
}
async function rafraichirSession() {
  const s = S.session; if (!s?.refresh_token) throw Object.assign(new Error('Session expirée : reconnectez-vous'), { reconnexion: true });
  try {
    const n = await requete('/auth/v1/token?grant_type=refresh_token', { methode: 'POST', corps: { refresh_token: s.refresh_token } });
    ecrireSession({ access_token: n.access_token, refresh_token: n.refresh_token, expires_at: n.expires_at || Math.floor(Date.now() / 1000) + (n.expires_in || 3600), user: { id: n.user?.id || s.user.id, email: n.user?.email || s.user.email } });
  } catch (e) {
    if (e.reseau) throw e;
    S.reconnexion = true; throw Object.assign(new Error('Session expirée : reconnectez-vous pour envoyer vos saisies'), { reconnexion: true });
  }
}
async function avecJeton(f) {
  if (!S.session) throw Object.assign(new Error('Non connecté'), { reconnexion: true });
  if ((S.session.expires_at || 0) - 90 < Date.now() / 1000) await rafraichirSession();
  try { return await f(S.session.access_token); }
  catch (e) { if (e.status === 401 || /jwt/i.test(e.message)) { await rafraichirSession(); return f(S.session.access_token); } throw e; }
}
const rpc = (nom, params = {}) => avecJeton((j) => requete('/rest/v1/rpc/' + nom, { methode: 'POST', corps: params, jeton: j }));
const fonctionServeur = (nom, corps) => avecJeton((j) => requete('/functions/v1/' + nom, { methode: 'POST', corps, jeton: j }));

/* ----------------------------------------------------------------- Saisie locale + file d'attente */
async function persisterOp(o) { const { envoi, ...x } = o; await IDB.ecrire('outbox', { ...x, k: o.op_id }); }
/** Enregistre une création ou une modification sur l'appareil, puis l'envoie dès que possible. */
async function enregistrer(table, id, patch, { force = false, sansSync = false } = {}) {
  id = id || uuid();
  const srv = S.srv[table].get(id);
  // Un changement de statut n'est jamais fusionné avec le précédent : chaque étape reste tracée
  let o = S.out.find((x) => x.table === table && x.id === id && x.statut === 'attente' && !x.envoi
    && !('statut' in patch && 'statut' in x.data && x.data.statut !== patch.statut));
  if (o && S.out.some((x) => x.table === table && x.id === id && x.seq > o.seq)) o = null;
  if (o) { o.data = { ...o.data, ...patch }; o.maj = new Date().toISOString(); if (force) o.force = true; }
  else {
    const autre = S.out.some((x) => x.table === table && x.id === id);
    o = { op_id: uuid(), seq: Date.now() + Math.random() / 10, table, id, base_version: srv ? srv.version : null, apresCreation: !srv && autre,
      data: { ...patch }, statut: 'attente', cree: new Date().toISOString(), force };
    S.out.push(o);
  }
  await persisterOp(o);
  reconstruire();
  majIndicateur();
  if (!sansSync) planifierSync();
  return id;
}
async function retirerOp(o) { S.out = S.out.filter((x) => x !== o); await IDB.suppr('outbox', o.op_id); }
let minuterieSync = null;
function planifierSync(delai = 800) { clearTimeout(minuterieSync); minuterieSync = setTimeout(() => synchroniser(), delai); }

async function synchroniser({ complet = false, manuel = false } = {}) {
  if (!S.session || S.reconnexion) { if (manuel) toast('Reconnectez-vous pour synchroniser', 'bad'); return; }
  if (S.sync) { S.resync = true; return; }
  S.sync = true; majIndicateur();
  try {
    await envoyer();
    await recevoir(complet);
    S.derniereSync = new Date().toISOString(); S.erreurSync = null; await kvSet('derniereSync', S.derniereSync);
    if (manuel) toast('Synchronisation terminée', 'ok');
  } catch (e) {
    S.erreurSync = e.message;
    if (e.reconnexion) S.reconnexion = true;
    if (e.code === '42501' && /inactif|non autorisé/.test(e.message)) { S.erreurSync = 'Votre accès Ambu Track a été désactivé. Contactez l’administrateur.'; S.reconnexion = true; }
    if (manuel || !e.reseau) toast(S.erreurSync, 'bad');
  } finally {
    S.sync = false; majIndicateur(); rafraichirVue();
    if (S.resync) { S.resync = false; planifierSync(300); }
  }
}
async function envoyer() {
  for (let tour = 0; tour < 100; tour++) {
    const bloques = new Set(S.out.filter((o) => o.statut !== 'attente').map((o) => o.table + '|' + o.id));
    const prets = S.out.filter((o) => o.statut === 'attente' && !bloques.has(o.table + '|' + o.id)).sort((a, b) => a.seq - b.seq);
    if (!prets.length) return;
    const lot = []; const vus = new Set(); let taille = 0;
    for (const o of prets) {
      const k = o.table + '|' + o.id; if (vus.has(k)) { vus.add('stop'); continue; }
      const t = JSON.stringify(o.data).length;
      if (lot.length && (taille + t > 800000 || lot.length >= 25)) break;
      lot.push(o); vus.add(k); taille += t;
    }
    lot.forEach((o) => { o.envoi = true; });
    let res;
    try {
      res = await rpc('ambu_push', { p_ops: lot.map((o) => ({ op_id: o.op_id, table: o.table, id: o.id, base_version: o.base_version ?? null, data: o.data, force: !!o.force })) });
    } finally { lot.forEach((o) => { delete o.envoi; }); }
    const lignes = [];
    for (const r of res || []) {
      const o = lot.find((x) => x.op_id === r.op_id); if (!o) continue;
      if (r.statut === 'ok') {
        await retirerOp(o);
        if (r.ligne) {
          S.srv[o.table].set(o.id, r.ligne); lignes.push({ k: o.table + '|' + o.id, t: o.table, r: r.ligne });
          for (const s of S.out) if (s.table === o.table && s.id === o.id && s.statut === 'attente') { s.base_version = r.ligne.version; s.apresCreation = false; await persisterOp(s); }
        }
      } else if (r.statut === 'conflit') {
        o.statut = 'conflit'; o.message = r.message; o.serveur = r.serveur; await persisterOp(o);
        if (r.serveur) { S.srv[o.table].set(o.id, r.serveur); lignes.push({ k: o.table + '|' + o.id, t: o.table, r: r.serveur }); }
      } else { o.statut = 'erreur'; o.message = r.message; o.code = r.code; await persisterOp(o); }
    }
    if (lignes.length) await IDB.ecrireN('lignes', lignes);
    reconstruire();
  }
}
async function recevoir(complet = false) {
  const depuis = complet || !S.dernierPull ? null : new Date(new Date(S.dernierPull).getTime() - 120000).toISOString();
  const r = await rpc('ambu_pull', { p_depuis: depuis });
  if (!depuis) { for (const t of TABLES) S.srv[t] = new Map(); await IDB.vider('lignes'); }
  const lignes = [];
  for (const [t, rows] of Object.entries(r.tables || {})) {
    if (!S.srv[t]) continue;
    for (const row of rows) { S.srv[t].set(row.id, row); lignes.push({ k: t + '|' + row.id, t, r: row }); }
  }
  if (lignes.length) await IDB.ecrireN('lignes', lignes);
  S.dernierPull = r.maintenant; await kvSet('dernierPull', r.maintenant);
  const moi = S.srv.ambu_profils.get(S.session.user.id);
  if (moi) { S.profil = moi; await kvSet('profil', moi); }
  reconstruire();
}

/* ----------------------------------------------------------------- Itinéraire estimé (carte) */
async function estimerItineraire(idA, idB) {
  const a = G('ambu_localites', idA), b = G('ambu_localites', idB);
  if (!a || !b || a.lat == null || b.lat == null) return null;
  if (a.id === b.id) return { km: 0, source: 'Même lieu' };
  const cle = a.id + '>' + b.id;
  if (S.itin[cle]) return S.itin[cle];
  const approx = { km: Math.round(distanceKm(a, b) * 1.25 * 10) / 10, source: 'Approximation (vol d’oiseau × 1,25)' };
  if (!navigator.onLine) return approx;
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 7000);
    const r = await fetch(`${CONFIG.OSRM}/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`, { signal: ctl.signal });
    clearTimeout(t);
    const j = await r.json();
    if (j.code !== 'Ok' || !j.routes?.[0]) return approx;
    const res = { km: Math.round(j.routes[0].distance / 100) / 10, source: 'Moteur d’itinéraire OSRM (OpenStreetMap)', geo: j.routes[0].geometry?.coordinates?.map(([x, y]) => [y, x]) };
    S.itin[cle] = res; kvSet('itin', S.itin).catch(() => {});
    return res;
  } catch { return approx; }
}

/* ----------------------------------------------------------------- Carte (Leaflet) */
async function creerCarte(el, { lieux = L('ambu_localites'), surClic, surLieu, zoom } = {}) {
  await chargerScript(CONFIG.LEAFLET);
  const carte = window.L.map(el, { zoomControl: true, attributionControl: true }).setView([0.6, 11.8], zoom || 6);
  window.L.tileLayer(CONFIG.TUILES, { maxZoom: 17, attribution: '© OpenStreetMap' }).addTo(carte);
  const couches = window.L.layerGroup().addTo(carte);
  for (const l of lieux) {
    if (l.lat == null || l.actif === false) continue;
    const c = l.type === 'site' || l.type === 'base' ? '#0b62a4' : l.verifie ? '#0f7a4f' : '#c26a00';
    const m = window.L.circleMarker([l.lat, l.lng], { radius: l.type === 'site' ? 9 : 7, color: '#fff', weight: 2, fillColor: c, fillOpacity: 1 }).addTo(couches);
    m.bindTooltip(l.nom);
    if (surLieu) m.on('click', () => surLieu(l, m));
  }
  if (surClic) carte.on('click', (e) => surClic(e.latlng));
  setTimeout(() => carte.invalidateSize(), 50);
  return carte;
}

function champLieu(nom, valeur, { obligatoire = false } = {}) {
  return `<input type="hidden" name="${nom}" value="${esc(valeur || '')}"><button type="button" class="choix-lieu" data-lieu="${nom}" data-champ="${nom}">
    <span>${valeur ? esc(nomLieu(valeur)) : '<span class="vide2">Choisir un lieu…</span>'}</span>${ic('lieu', 18)}</button>`;
}
function lierLieux(racine, surChange) {
  $$('[data-lieu]', racine).forEach((b) => b.onclick = () => choisirLieu((l) => {
    const inp = racine.querySelector(`input[name="${b.dataset.lieu}"]`); inp.value = l.id;
    b.querySelector('span').textContent = l.nom; b.classList.remove('invalide');
    if (surChange) surChange(b.dataset.lieu, l);
  }));
}
function choisirLieu(cb) {
  const lieux = L('ambu_localites').filter((l) => l.actif !== false).sort((a, b) => (a.type === 'site' ? -1 : 0) - (b.type === 'site' ? -1 : 0) || a.nom.localeCompare(b.nom, 'fr'));
  modale('Choisir un lieu', `<input type="search" placeholder="Rechercher une ville, un village, un site…" data-q autofocus>
    <div class="onglets" style="margin-top:8px"><button type="button" class="actif" data-mode="liste">Liste</button><button type="button" data-mode="carte">Sur la carte</button></div>
    <div class="recherche-lieux" data-res></div><div class="carte-map mini cache" data-carte style="height:52vh"></div>
    <p class="aide">Lieu absent ? Signalez-le depuis l’écran Carte pour correction du référentiel.</p>`, (el, fermer) => {
    const res = $('[data-res]', el);
    const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const dessiner = () => {
      const q = norm($('[data-q]', el).value);
      const l2 = lieux.filter((l) => !q || norm(l.nom + ' ' + (l.province || '')).includes(q)).slice(0, 80);
      res.innerHTML = l2.length ? l2.map((l) => `<button type="button" data-id="${l.id}">${ic('lieu', 16)}<span style="flex:1"><b>${esc(l.nom)}</b><br><small class="aide">${esc(LIB.typeLoc[l.type] || '')}${l.province ? ' · ' + esc(l.province) : ''}${l.verifie ? '' : ' · non vérifié'}</small></span></button>`).join('') : '<div class="vide">Aucun lieu trouvé</div>';
      $$('button[data-id]', res).forEach((b) => b.onclick = () => { cb(G('ambu_localites', b.dataset.id)); fermer(); });
    };
    $('[data-q]', el).oninput = dessiner; dessiner();
    let carte = null;
    $$('[data-mode]', el).forEach((b) => b.onclick = async () => {
      $$('[data-mode]', el).forEach((x) => x.classList.toggle('actif', x === b));
      const enCarte = b.dataset.mode === 'carte';
      res.classList.toggle('cache', enCarte); $('[data-carte]', el).classList.toggle('cache', !enCarte);
      if (enCarte && !carte) {
        try { carte = await creerCarte($('[data-carte]', el), { lieux, surLieu: (l) => { cb(l); fermer(); } }); }
        catch (e) { $('[data-carte]', el).innerHTML = `<div class="vide">${esc(e.message)}</div>`; }
      }
    });
  });
}

/* ================================================================= AMBULANCES */
VUES.ambulances = (arg, q) => {
  let ambs = ambulancesVisibles(); const fs = q.site || '', fst = q.statut || '', fq = (q.q || '').toLowerCase();
  if (fs) ambs = ambs.filter((a) => a.site_id === fs); if (fst) ambs = ambs.filter((a) => a.statut === fst);
  if (fq) ambs = ambs.filter((a) => `${a.code} ${a.immatriculation} ${a.chassis || ''} ${a.modele || ''}`.toLowerCase().includes(fq));
  return { html: entete('Ambulances', `${ambs.length} véhicule(s)`, peut.sup() ? `<a class="btn p" href="#/ambulance-form">${ic('plus', 18)} Ajouter</a>` : '')
    + `<div class="filtres"><input type="search" data-f="q" placeholder="Code, immatriculation, châssis…" value="${esc(q.q || '')}"><select data-f="site">${options(sitesVisibles().map((s) => [s.id, s.nom]), fs, 'Tous les sites')}</select>
      <select data-f="statut">${options(Object.entries(LIB.statutAmb).map(([k, v]) => [k, v[0]]), fst, 'Tous les statuts')}</select></div>
    <div class="liste">${ambs.length ? ambs.map(ligneAmbulance).join('') : videAction('Aucune ambulance ne correspond.', peut.sup() ? ['#/ambulance-form', 'Ajouter une ambulance'] : null)}</div>`,
  init(el) {
    const go = () => { const p = new URLSearchParams(); $$('[data-f]', el).forEach((x) => x.value && p.set(x.dataset.f, x.value)); location.hash = '#/ambulances?' + p; };
    $$('select[data-f]', el).forEach((s) => s.onchange = go); const qq = $('input[data-f]', el); qq.onchange = go;
  } };
};
VUES.ambulance = (id, q) => {
  const a = amb(id); if (!a) return { html: entete('Ambulance introuvable', '', '', '#/ambulances') };
  const onglet = q.onglet || 'resume'; const k = kmCourant(id); const m = missionEnCours(id);
  const al = alertes(id);
  const onglets = [['resume', 'Résumé'], ['historique', 'Historique'], ['documents', 'Documents'], ['entretien', 'Entretien'], ['equipements', 'Équipements']];
  let corps = '';
  if (onglet === 'resume') {
    corps = `<div class="grille g2 r1"><div class="carte"><h2>Fiche</h2><dl class="def">
      <dt>Identifiant</dt><dd>${esc(a.code)}</dd><dt>Immatriculation</dt><dd>${esc(a.immatriculation)}</dd><dt>N° de châssis</dt><dd class="mono">${esc(a.chassis || '—')}</dd>
      <dt>Marque / modèle</dt><dd>${esc([a.marque, a.modele].filter(Boolean).join(' ') || '—')}</dd><dt>Année</dt><dd>${esc(a.annee || '—')}</dd>
      <dt>Site d’affectation</dt><dd>${esc(nomSite(a.site_id))}</dd><dt>Permis exigé</dt><dd>Catégorie ${esc(a.categorie_permis || 'B')}</dd><dt>Statut</dt><dd>${m ? '<span class="chip info">En mission</span> ' : ''}${chip(LIB.statutAmb[a.statut])}</dd>
      <dt>Responsable / équipe</dt><dd>${esc(a.responsable || '—')}</dd><dt>Kilométrage courant</dt><dd>${nf(k.km)} km <span class="aide">(${k.quand ? 'mis à jour le ' + fmtDH(k.quand) : 'valeur initiale'})</span></dd>
      <dt>Caractéristiques</dt><dd>${esc(a.caracteristiques || '—')}</dd><dt>Notes</dt><dd>${esc(a.notes || '—')}</dd></dl></div>
      <div class="carte"><h2>Alertes</h2>${al.length ? al.map((x) => `<a class="alerte ${x.niveau}" href="${x.href}"><span>${ic('alerte', 18)}</span><span><b>${esc(x.titre)}</b><small>${esc(x.detail || '')}</small></span></a>`).join('') : vide('Aucune alerte pour ce véhicule.')}
      ${m ? `<a class="alerte" href="#/mission/${m.id}"><span>${ic('mission', 18)}</span><span><b>Mission en cours</b><small>${esc(nomLieu(m.depart_id))} → ${esc(nomLieu(m.destination_id))} depuis ${fmtH(m.debut)}</small></span></a>` : ''}</div></div>`;
  } else if (onglet === 'historique') {
    const ev = [
      ...parAmb('ambu_missions', id).map((x) => ({ d: x.debut, cls: x.statut === 'cloturee' ? 'ok' : 'info', href: '#/mission/' + x.id, t: `Mission ${LIB.statutMission[x.statut][0].toLowerCase()} · ${nomLieu(x.depart_id)} → ${nomLieu(x.destination_id)}`, s: x.statut === 'cloturee' ? `${nf(x.distance_compteur)} km · ${fmtDuree(x.duree_min)}` : `départ ${nf(x.km_depart)} km`, type: 'missions' })),
      ...parAmb('ambu_inspections', id).map((x) => ({ d: x.date_controle, cls: x.critique ? 'bad' : x.nb_nc ? 'warn' : 'ok', href: '#/controle-voir/' + x.id, t: `Contrôle · ${LIB.typeCtrl[x.type_controle]}`, s: `${x.nb_nc || 0} NC · ${LIB.statutDecl[x.statut_declare]?.[0] || ''}`, type: 'controles' })),
      ...parAmb('ambu_signalements', id).map((x) => ({ d: x.date_evt, cls: x.type === 'accident' ? 'bad' : 'warn', href: '#/signalement/' + x.id, t: `${LIB.typeSig[x.type]} · ${LIB.statutSig[x.statut][0]}`, s: x.description, type: 'signalements' })),
      ...parAmb('ambu_entretiens', id).map((x) => ({ d: x.date_op + 'T12:00:00Z', cls: 'info', href: '#/entretien-form/' + x.id, t: `${LIB.typeEnt[x.type]}${x.statut === 'planifie' ? ' (planifié)' : ''}`, s: `${x.km != null ? nf(x.km) + ' km · ' : ''}${x.atelier || ''} ${x.description || ''}`, type: 'entretiens' })),
      ...parAmb('ambu_documents', id).map((x) => ({ d: (x.emission || x.created_at?.slice(0, 10) || '') + 'T12:00:00Z', cls: 'info', href: '#/ambulance/' + id + '?onglet=documents', t: `${LIB.typeDoc[x.type]}${x.statut === 'remplace' ? ' (remplacé)' : ''}`, s: `Validité : ${fmtJ(x.expiration)}`, type: 'documents' })),
    ].filter((x) => !q.type || x.type === q.type).sort((x, y) => (y.d || '').localeCompare(x.d || ''));
    corps = `<div class="onglets">${[['', 'Tout'], ['missions', 'Missions'], ['controles', 'Contrôles'], ['signalements', 'Anomalies / incidents'], ['entretiens', 'Entretiens'], ['documents', 'Documents']].map(([t, l]) => `<a class="${(q.type || '') === t ? 'actif' : ''}" href="#/ambulance/${id}?onglet=historique${t ? '&type=' + t : ''}">${l}</a>`).join('')}</div>
      <div class="carte">${ev.length ? `<div class="chrono">${ev.map((x) => `<div class="ev ${x.cls}"><a href="${x.href}"><b>${esc(x.t)}</b><br><span class="aide">${fmtDH(x.d)} · ${esc(x.s || '')}</span></a></div>`).join('')}</div>` : vide('Aucun événement.')}</div>`;
  } else if (onglet === 'documents') {
    const docs = documentsCourants(id);
    const tous = parAmb('ambu_documents', id).sort((x, y) => (y.expiration || '').localeCompare(x.expiration || ''));
    corps = `<div class="carte"><h2>Documents en vigueur</h2><div class="liste">${Object.keys(LIB.typeDoc).filter((t) => DOCS_SUIVIS.includes(t) || docs[t]).map((t) => { const d = docs[t]; const e = d ? etatDocument(d) : null;
      return `<div class="ligne"><span>${ic('doc', 22)}</span><div class="corps"><div class="t">${LIB.typeDoc[t]}${d?.numero ? ' · ' + esc(d.numero) : ''}</div><div class="s">${d ? esc(e.texte) + (d.fournisseur ? ' · ' + esc(d.fournisseur) : '') : 'Non enregistré'}</div>${d ? vignettes(d.fichiers) : ''}</div>
      <div class="droite">${d ? chip([e.niveau === 'ok' ? 'Valide' : e.niveau === 'critique' ? 'Expiré' : e.niveau === 'haute' ? 'Bientôt' : 'Sans date', e.niveau === 'ok' ? 'ok' : e.niveau === 'critique' ? 'bad' : e.niveau === 'haute' ? 'warn' : 'mute']) : '<span class="chip mute">Manquant</span>'}
      ${peut.gestion() ? `<button class="btn petit" data-doc="${t}" data-rempl="${d?.id || ''}">${d ? 'Renouveler' : 'Ajouter'}</button>` : ''}</div></div>`; }).join('')}</div>
      ${peut.gestion() ? `<button class="btn" style="margin-top:10px" data-doc="autre" data-rempl="">${ic('plus', 18)} Autre document (fiche technique, carte grise…)</button>` : ''}</div>
      <div class="carte"><h2>Historique des documents</h2>${tous.length ? `<div class="defile"><table class="tab"><thead><tr><th>Type</th><th>Numéro</th><th>Émission</th><th>Expiration</th><th>Statut</th><th>Pièces</th></tr></thead><tbody>${tous.map((d) => `<tr><td>${LIB.typeDoc[d.type]}${d.libelle ? ' — ' + esc(d.libelle) : ''}</td><td>${esc(d.numero || '—')}</td><td>${fmtJ(d.emission)}</td><td>${fmtJ(d.expiration)}</td><td>${d.statut === 'valide' ? 'En vigueur' : d.statut === 'remplace' ? 'Remplacé' : 'Archivé'}</td><td>${vignettes(d.fichiers)}</td></tr>`).join('')}</tbody></table></div>` : vide('Aucun document.')}</div>`;
  } else if (onglet === 'entretien') {
    const pe = prochainEntretien(id);
    const ents = parAmb('ambu_entretiens', id).sort((x, y) => (y.date_op || '').localeCompare(x.date_op || ''));
    corps = `<div class="bandeau ${pe.niveau === 'critique' ? 'bad' : pe.niveau === 'haute' ? 'warn' : pe.niveau === 'ok' ? 'ok' : ''}"><b>Prochaine vidange :</b> ${esc(pe.texte)}. <span class="aide">Kilométrage courant : ${nf(k.km)} km.</span></div>
      ${peut.gestion() ? `<a class="btn p" style="margin-bottom:12px" href="#/entretien-form?amb=${id}">${ic('plus', 18)} Enregistrer un entretien</a>` : ''}
      <div class="liste">${ents.length ? ents.map(ligneEntretien).join('') : videAction('Aucun entretien enregistré.', peut.gestion() ? ['#/entretien-form', 'Enregistrer un entretien'] : null)}</div>`;
  } else if (onglet === 'equipements') {
    const eq = a.equipements || [];
    corps = `<div class="carte"><h2>Équipements embarqués</h2>${eq.length ? `<div class="liste" data-eq>${eq.map((e, i) => `<div class="ligne"><div class="corps"><div class="t">${esc(e.nom)}</div>${e.note ? `<div class="s">${esc(e.note)}</div>` : ''}</div>
      <div class="droite">${peut.gestion() ? `<select data-i="${i}" style="min-width:150px">${options(Object.entries(LIB.equip).map(([k2, v]) => [k2, v[0]]), e.statut)}</select>` : chip(LIB.equip[e.statut] || LIB.equip.ok)}</div></div>`).join('')}</div>` : vide('Aucun équipement renseigné.')}
      ${peut.gestion() ? '<p class="aide">Le changement de statut est enregistré immédiatement et tracé.</p>' : ''}</div>`;
  }
  return { html: entete(`${esc(a.code)} · ${esc(a.immatriculation)}`, `${esc([a.marque, a.modele].filter(Boolean).join(' '))} · ${esc(nomSite(a.site_id))} · ${nf(k.km)} km`,
      (peut.terrain() && !m && a.statut !== 'immobilisee' ? `<a class="btn p" href="#/mission-nouvelle?amb=${id}">Démarrer une mission</a>` : '') + (peut.terrain() ? `<a class="btn" href="#/kilometrage?amb=${id}">${ic('jauge', 16)} Relevé km</a><a class="btn" href="#/controle?amb=${id}">Contrôle</a><a class="btn" href="#/signaler?type=anomalie&amb=${id}">Signaler</a>` : '')
      + (peut.gestion() ? `<button class="btn" data-statut>Changer le statut</button><a class="btn" href="#/ambulance-form/${id}">Modifier</a>` : '') + (peut.admin() ? `<button class="btn petit" data-audit="${id}">Historique des modifications</button>` : ''), '#/ambulances')
    + `<div class="barre-actions" style="margin-bottom:10px">${m ? '<span class="chip info">En mission</span>' : ''}${chip(LIB.statutAmb[a.statut])}${etatSync(a)}</div>
      <div class="onglets">${onglets.map(([o, l]) => `<a href="#/ambulance/${id}?onglet=${o}" class="${o === onglet ? 'actif' : ''}">${l}</a>`).join('')}</div>${corps}`,
  init(el) {
    lierAudit(el);
    $$('[data-doc]', el).forEach((b) => b.onclick = () => formDocument(id, b.dataset.doc, b.dataset.rempl || null));
    $$('[data-eq] select', el).forEach((s) => s.onchange = async () => {
      const eq = (amb(id).equipements || []).map((x) => ({ ...x })); eq[Number(s.dataset.i)].statut = s.value; eq[Number(s.dataset.i)].maj = new Date().toISOString();
      await enregistrer('ambu_ambulances', id, { equipements: eq }); toast('Statut de l’équipement enregistré', 'ok');
    });
    const bs = $('[data-statut]', el);
    if (bs) bs.onclick = () => modale('Statut opérationnel', `<form><div class="champ"><label class="lib">Nouveau statut</label><select name="statut">${options(Object.entries(LIB.statutAmb).filter(([k2]) => peut.sup() || (k2 !== 'immobilisee' && a.statut !== 'immobilisee') || k2 === a.statut).map(([k2, v]) => [k2, v[0]]), a.statut)}</select>
      ${peut.sup() ? '' : '<div class="aide">L’immobilisation et sa levée sont réservées au superviseur (procédure Fortescue).</div>'}</div>
      <div class="champ"><label class="lib">Motif / commentaire</label><textarea name="motif" maxlength="500"></textarea></div><button class="btn p large">Enregistrer</button></form>`, (mc, fermer) => {
      $('form', mc).onsubmit = async (e) => { e.preventDefault(); const v = lireForm(e.target);
        if (v.statut === a.statut) return fermer();
        if (['immobilisee', 'hors_service'].includes(v.statut) && v.motif.length < 3) return toast('Indiquez le motif', 'bad');
        await enregistrer('ambu_ambulances', id, { statut: v.statut, notes: v.motif ? `${[a.notes, `[${fmtDH(new Date().toISOString())}] ${LIB.statutAmb[v.statut][0]} : ${v.motif}`].filter(Boolean).join('\n')}` : a.notes });
        fermer(); toast('Statut mis à jour', 'ok'); router(); };
    });
  } };
};
VUES['ambulance-form'] = (id) => {
  const a = id ? amb(id) : null;
  if (!(a ? peut.gestion() : peut.sup())) return { html: entete('Accès refusé') + '<div class="bandeau warn">Réservé au superviseur ou à l’administrateur.</div>' };
  const eq = a ? a.equipements || [] : (listes().equipements_defaut || []).map((n) => ({ nom: n, statut: 'ok' }));
  const modeles = ['Hilux GUN125 4x4', 'Land Cruiser 78', 'Land Cruiser 79', 'Land Cruiser Prado', 'Hiace', 'Autre'];
  return { form: true, html: entete(a ? `Modifier ${esc(a.code)}` : 'Nouvelle ambulance', '', '', a ? '#/ambulance/' + id : '#/ambulances')
    + `<form class="carte" id="fa" novalidate><div class="grille g2 r1">
      <div class="champ"><label class="lib">Identifiant interne <span class="obl">*</span></label><input name="code" required maxlength="30" value="${esc(a?.code || '')}" placeholder="AMB-01"></div>
      <div class="champ"><label class="lib">Immatriculation <span class="obl">*</span></label><input name="immatriculation" required maxlength="30" value="${esc(a?.immatriculation || '')}"></div>
      <div class="champ"><label class="lib">Numéro de châssis</label><input name="chassis" maxlength="40" class="mono" value="${esc(a?.chassis || '')}"></div>
      <div class="champ"><label class="lib">Site d’affectation <span class="obl">*</span></label><select name="site_id" ${a && !peut.sup() ? 'disabled' : ''}>${options(sitesVisibles().map((s) => [s.id, s.nom]), a?.site_id, 'Choisir')}</select></div>
      <div class="champ"><label class="lib">Marque</label><input name="marque" value="${esc(a?.marque || 'Toyota')}"></div>
      <div class="champ"><label class="lib">Modèle</label><input name="modele" list="modeles" value="${esc(a?.modele || '')}"><datalist id="modeles">${modeles.map((x) => `<option value="${x}">`).join('')}</datalist></div>
      <div class="champ"><label class="lib">Année</label><input type="number" name="annee" min="1980" max="2100" value="${esc(a?.annee || '')}"></div>
      <div class="champ"><label class="lib">Kilométrage initial (à la mise en service dans l’application)</label><input type="number" name="km_initial" min="0" value="${esc(a?.km_initial ?? '')}"></div>
      <div class="champ"><label class="lib">Catégorie de permis exigée</label><select name="categorie_permis">${options(listes().categories_permis || ['B'], a?.categorie_permis || 'B')}</select><div class="aide">Vérifiée au démarrage de chaque mission.</div></div>
      <div class="champ"><label class="lib">Responsable / équipe de référence</label><input name="responsable" value="${esc(a?.responsable || '')}"></div>
      ${a ? '' : `<div class="champ"><label class="lib">Statut</label><select name="statut">${options(Object.entries(LIB.statutAmb).map(([k, v]) => [k, v[0]]), 'disponible')}</select></div>`}</div>
      <div class="champ"><label class="lib">Caractéristiques</label><textarea name="caracteristiques" placeholder="Diesel, 4x4, cellule sanitaire…">${esc(a?.caracteristiques || '')}</textarea></div>
      <div class="champ"><label class="lib">Notes</label><textarea name="notes">${esc(a?.notes || '')}</textarea></div>
      <h3>Équipements embarqués</h3><div data-eqs></div><button type="button" class="btn petit" data-ajeq>${ic('plus', 16)} Ajouter un équipement</button>
      <div style="margin-top:16px"><button class="btn p large">${a ? 'Enregistrer les modifications' : 'Créer l’ambulance'}</button></div></form>`,
  init(el) {
    const f = $('#fa', el); const liste = eq.map((x) => ({ ...x }));
    const dess = () => { $('[data-eqs]', el).innerHTML = liste.map((x, i) => `<div style="display:flex;gap:6px;margin-bottom:6px"><input data-n="${i}" value="${esc(x.nom)}" style="flex:2"><select data-s="${i}" style="flex:1">${options(Object.entries(LIB.equip).map(([k, v]) => [k, v[0]]), x.statut)}</select><button type="button" class="btn petit" data-x="${i}" aria-label="Retirer">✕</button></div>`).join('');
      $$('[data-n]', el).forEach((i) => i.oninput = () => { liste[i.dataset.n].nom = i.value; }); $$('[data-s]', el).forEach((i) => i.onchange = () => { liste[i.dataset.s].statut = i.value; });
      $$('[data-x]', el).forEach((b) => b.onclick = () => { liste.splice(Number(b.dataset.x), 1); dess(); }); };
    dess(); $('[data-ajeq]', el).onclick = () => { liste.push({ nom: '', statut: 'ok' }); dess(); };
    f.onsubmit = async (e) => {
      e.preventDefault(); const v = lireForm(f);
      if (!v.code) return erreurChamp(f, 'code', 'L’identifiant est obligatoire');
      if (!v.immatriculation) return erreurChamp(f, 'immatriculation', 'L’immatriculation est obligatoire');
      if (!a && !v.site_id) return erreurChamp(f, 'site_id', 'Choisissez le site');
      if (L('ambu_ambulances').some((x) => x.id !== id && x.code.toLowerCase() === v.code.toLowerCase())) return erreurChamp(f, 'code', 'Cet identifiant existe déjà');
      const data = { code: v.code, immatriculation: v.immatriculation.toUpperCase(), chassis: v.chassis || null, marque: v.marque || 'Toyota', modele: v.modele || null, annee: v.annee, km_initial: v.km_initial || 0,
        responsable: v.responsable || null, categorie_permis: v.categorie_permis || 'B', caracteristiques: v.caracteristiques || null, notes: v.notes || null, equipements: liste.filter((x) => x.nom.trim()) };
      if (v.site_id && (!a || peut.sup())) data.site_id = v.site_id;
      if (!a) data.statut = v.statut || 'disponible';
      const nid = await enregistrer('ambu_ambulances', id || null, data);
      S.enForm = false; toast(a ? 'Modifications enregistrées' : 'Ambulance créée', 'ok'); location.hash = '#/ambulance/' + nid;
    };
  } };
};

/* ================================================================= CONTRÔLES QUOTIDIENS */
VUES.controles = (arg, q) => {
  let cs = L('ambu_inspections'); if (q.amb) cs = cs.filter((c) => c.ambulance_id === q.amb);
  const onglet = q.onglet || 'tous';
  if (onglet === 'revoir') cs = cs.filter((c) => c.revue_statut === 'a_revoir'); if (onglet === 'nc') cs = cs.filter((c) => c.nb_nc > 0);
  cs.sort((a, b) => (b.date_controle || '').localeCompare(a.date_controle || ''));
  return { html: entete('Contrôles quotidiens', 'Fiche de contrôle et de transmission (prise et fin de service)', peut.terrain() ? `<a class="btn p" href="#/controle">${ic('plus', 18)} Nouveau contrôle</a>` : '')
    + `<div class="onglets">${[['tous', 'Tous'], ['revoir', 'À revoir'], ['nc', 'Avec NC']].map(([k, l]) => `<a href="#/controles?onglet=${k}" class="${k === onglet ? 'actif' : ''}">${l}</a>`).join('')}</div>
    <div class="liste">${cs.length ? cs.slice(0, 300).map((c) => `<a class="ligne" href="#/controle-voir/${c.id}"><span style="color:var(--ok)">${ic('controle', 24)}</span><div class="corps"><div class="t">${esc(amb(c.ambulance_id)?.code || '?')} · ${LIB.typeCtrl[c.type_controle]}</div>
      <div class="s">${fmtDH(c.date_controle)} · ${esc(c.controleur_nom || nomUser(c.created_by))}${c.km != null ? ' · ' + nf(c.km) + ' km' : ''}</div></div>
      <div class="droite">${chip(LIB.statutDecl[c.statut_declare])}${c.nb_nc ? `<span class="chip ${c.critique ? 'bad' : 'warn'}">${c.nb_nc} NC</span>` : ''}${c.revue_statut === 'a_revoir' ? '<span class="chip bad">À revoir</span>' : ''}${etatSync(c)}</div></a>`).join('') : videAction('Aucun contrôle dans cette liste.', peut.terrain() ? ['#/controle', 'Faire un contrôle'] : null)}</div>` };
};
VUES.controle = (arg, q) => {
  if (!peut.terrain()) return { html: entete('Contrôle') + '<div class="bandeau warn">Votre profil est en consultation seule.</div>' };
  const grilles = P('controle', []) || []; const vues = P('photos_controle', []) || []; const lst = listes();
  const ambs = ambulancesVisibles(); const choix = q.amb || (ambs.length === 1 ? ambs[0].id : '');
  const total = grilles.reduce((s, g) => s + g.items.length, 0);
  const heure = Number(partsGabon(new Date()).hour);

function ligneEntretien(e) {
  return `<a class="ligne" href="#/entretien-form/${e.id}"><span style="color:var(--info)">${ic('entretien', 22)}</span><div class="corps"><div class="t">${LIB.typeEnt[e.type]} · ${esc(amb(e.ambulance_id)?.code || '')}${e.statut === 'planifie' ? ' (planifié)' : ''}</div>

}
function echeances() {
  const res = [];
  for (const a of ambulancesVisibles()) {
    const docs = documentsCourants(a.id);
    for (const t of Object.keys(LIB.typeDoc)) { const d = docs[t]; if (!d?.expiration) continue; const e = etatDocument(d); res.push({ amb: a, type: LIB.typeDoc[t], texte: e.texte, niveau: e.niveau, jours: e.jours, href: '#/ambulance/' + a.id + '?onglet=documents' }); }
    for (const t of DOCS_SUIVIS) if (!docs[t]) res.push({ amb: a, type: LIB.typeDoc[t], texte: 'Non enregistré', niveau: 'info', jours: null, href: '#/ambulance/' + a.id + '?onglet=documents' });
    const pe = prochainEntretien(a.id); res.push({ amb: a, type: 'Vidange', texte: pe.texte, niveau: pe.niveau, jours: pe.resteJ ?? null, href: '#/ambulance/' + a.id + '?onglet=entretien' });
    for (const e of parAmb('ambu_entretiens', a.id)) if (e.statut === 'planifie') { const j = ecartJours(aujourdhui(), e.date_op); res.push({ amb: a, type: LIB.typeEnt[e.type] + ' planifié', texte: `Prévu le ${fmtJ(e.date_op)}`, niveau: j < 0 ? 'critique' : j <= seuils().rappel_entretien_jours ? 'haute' : 'ok', jours: j, href: '#/entretien-form/' + e.id }); }
  }
  const rang = { critique: 0, haute: 1, info: 2, ok: 3 };
  return res.sort((x, y) => rang[x.niveau] - rang[y.niveau] || (x.jours ?? 9999) - (y.jours ?? 9999));
}

/* ================================================================= RAPPORTS */
function periode(q) {
  const auj = aujourdhui(); const t = q.periode || 'mois';
  if (t === 'jour') return { du: q.du || auj, au: q.du || auj, nom: 'Rapport quotidien' };
  if (t === 'semaine') { const d = new Date(auj + 'T12:00:00Z'); const lundi = ajoutJours(auj, -((d.getUTCDay() + 6) % 7)); return { du: lundi, au: ajoutJours(lundi, 6), nom: 'Rapport hebdomadaire' }; }
  if (t === 'mois_prec') { const [y, m] = auj.split('-').map(Number); const d1 = new Date(Date.UTC(y, m - 2, 1)); const du = d1.toISOString().slice(0, 10); const au = new Date(Date.UTC(y, m - 1, 0)).toISOString().slice(0, 10); return { du, au, nom: 'Rapport mensuel' }; }
  if (t === 'perso') return { du: q.du || auj, au: q.au || auj, nom: 'Rapport personnalisé' };
  const du = auj.slice(0, 8) + '01'; const [y, m] = auj.split('-').map(Number); return { du, au: new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10), nom: 'Rapport mensuel' };
}
function calculRapport(q) {
  const p = periode(q); const dans = (iso) => { const j = jourDe(iso); return !!j && j >= p.du && j <= p.au; };
  const ambs = ambulancesVisibles().filter((a) => (!q.site || a.site_id === q.site) && (!q.amb || a.id === q.amb)); const ids = new Set(ambs.map((a) => a.id));
  const missions = L('ambu_missions').filter((m) => ids.has(m.ambulance_id) && dans(m.debut) && (!q.statut || m.statut === q.statut));
  const clot = missions.filter((m) => m.statut === 'cloturee');
  const ctrl = L('ambu_inspections').filter((i) => ids.has(i.ambulance_id) && dans(i.date_controle));
  const sigs = L('ambu_signalements').filter((s) => ids.has(s.ambulance_id) && (!q.type || s.type === q.type));
  const sigNouv = sigs.filter((s) => dans(s.date_evt));
  const sigResolus = sigs.filter((s) => (s.historique || []).some((h) => ['resolu', 'cloture'].includes(h.a) && dans(h.le)));
  const ents = L('ambu_entretiens').filter((e) => ids.has(e.ambulance_id) && e.statut === 'realise' && dans(e.date_op + 'T12:00:00Z'));
  const km = (m) => Number(m.distance_compteur) > 0 ? Number(m.distance_compteur) : 0;
  const par = ambs.map((a) => { const ms = missions.filter((m) => m.ambulance_id === a.id); const mc = ms.filter((m) => m.statut === 'cloturee');
    return { a, missions: ms.length, cloturees: mc.length, km: mc.reduce((s, m) => s + km(m), 0), heures: mc.reduce((s, m) => s + (Number(m.duree_min) > 0 ? Number(m.duree_min) : 0), 0) / 60,
      ctrl: ctrl.filter((i) => i.ambulance_id === a.id).length, nc: ctrl.filter((i) => i.ambulance_id === a.id).reduce((s, i) => s + (i.nb_nc || 0), 0),
      anom: sigNouv.filter((s) => s.ambulance_id === a.id && s.type === 'anomalie').length, inc: sigNouv.filter((s) => s.ambulance_id === a.id && s.type !== 'anomalie').length,
      ent: ents.filter((e) => e.ambulance_id === a.id).length, cout: ents.filter((e) => e.ambulance_id === a.id).reduce((s, e) => s + (Number(e.cout) || 0), 0) + sigs.filter((s) => s.ambulance_id === a.id).flatMap((s) => s.suivi || []).filter((x) => x.date && dans(x.date + 'T12:00:00Z')).reduce((s, x) => s + (Number(x.cout) || 0), 0),
      statut: missionEnCours(a.id) ? 'En mission' : LIB.statutAmb[a.statut][0] }; });
  const parSite = sitesVisibles().map((s) => { const r = par.filter((x) => x.a.site_id === s.id); return { s, n: r.length, missions: r.reduce((t, x) => t + x.missions, 0), km: r.reduce((t, x) => t + x.km, 0), ctrl: r.reduce((t, x) => t + x.ctrl, 0), anom: r.reduce((t, x) => t + x.anom, 0), inc: r.reduce((t, x) => t + x.inc, 0), cout: r.reduce((t, x) => t + x.cout, 0) }; }).filter((x) => x.n);
  const parChauffeur = conducteursVisibles().map((c) => { const mc = clot.filter((m) => m.chauffeur_id === c.id);
    return { c, missions: missions.filter((m) => m.chauffeur_id === c.id).length, km: mc.reduce((s, m) => s + km(m), 0), heures: mc.reduce((s, m) => s + (Number(m.duree_min) > 0 ? Number(m.duree_min) : 0), 0) / 60 }; }).filter((x) => x.missions);
  const retard = sigs.filter((s) => ouvert(s) && s.echeance && s.echeance < aujourdhui());
  const ech = echeances().filter((x) => ids.has(x.amb.id) && x.niveau !== 'ok' && x.niveau !== 'info');
  const ecarts = clot.filter((m) => (m.alertes || []).length);
  const dispo = ambs.filter((a) => ['disponible', 'reserve'].includes(a.statut)).length;

function jaugeEntretien(e, kmAct) {
  let pct = null;
  if (e.km != null && e.depuisKm != null && e.km > e.depuisKm) pct = Math.max(0, Math.min(100, (kmAct - e.depuisKm) / (e.km - e.depuisKm) * 100));
  else if (e.resteKm != null) pct = e.resteKm <= 0 ? 100 : null;
  const etat = { critique: ['Dépassé', 'bad'], haute: ['À prévoir', 'warn'], ok: ['À jour', 'ok'], info: ['À compléter', 'mute'] }[e.niveau];
  return `<div class="jauge-ent"><div class="haut"><b>${esc(e.libelle)}</b>${chip(etat)}</div>${pct != null ? `<div class="barre-km ${e.niveau}"><i style="width:${pct.toFixed(0)}%"></i></div>` : ''}<div class="aide">${esc(e.texte)}${e.depuisDate ? ` · dernière le ${fmtJ(e.depuisDate)}${e.depuisKm != null ? ' à ' + nf(e.depuisKm) + ' km' : ''}` : ''}</div></div>`;
}

        <div class="barre-actions" style="margin-top:10px">${peut.terrain() ? `<a class="btn petit" href="#/kilometrage?amb=${a.id}">${ic('jauge', 16)} Relevé km</a>` : ''}${peut.gestion() ? `<a class="btn petit" href="#/entretien-form?amb=${a.id}">${ic('entretien', 16)} Enregistrer un entretien</a>` : ''}</div></div>`).join('') : videAction('Aucune ambulance enregistrée.', null))

      return { a, etats, pire: Math.min(...etats.map((x) => ({ critique: 0, manquant: 1, haute: 2 }[x.e.niveau] ?? 3))) }; }).sort((x, y) => x.pire - y.pire);

      + `<p class="aide">Pièces du véhicule = documents administratifs (assurance, visite technique, extincteur, carte grise, autorisations). Rappel ${sl.rappel_document_jours} jours avant l’expiration.</p>`;
  } else if (onglet === 'permis') {
    const cs = conducteursVisibles().map((c) => { const p = etatValidite(c.permis_expiration, sl.rappel_permis_jours); return { c, p, a: etatValidite(c.aptitude_expiration, sl.rappel_permis_jours), sc: etatValidite(c.secourisme_expiration, sl.rappel_permis_jours) }; })

/* ================================================================= RELEVÉS KILOMÉTRIQUES */
function courbeKm(releves) {
  if (releves.length < 2) return '';
  const pts = releves.map((r) => ({ t: new Date(r.date_releve).getTime(), k: Number(r.km) }));
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t || t0 + 1, k0 = Math.min(...pts.map((p) => p.k)), k1 = Math.max(...pts.map((p) => p.k));
  const X = (t) => 8 + (t1 === t0 ? 0 : (t - t0) / (t1 - t0)) * 584, Y = (k) => 100 - (k1 === k0 ? 0.5 : (k - k0) / (k1 - k0)) * 84;
  const ligne = pts.map((p) => `${X(p.t).toFixed(1)},${Y(p.k).toFixed(1)}`).join(' ');
  return `<svg class="courbe" viewBox="0 0 600 120" preserveAspectRatio="none" role="img" aria-label="Évolution du kilométrage">
    <line x1="8" y1="100" x2="592" y2="100" stroke="var(--bord)"/><polygon points="${X(pts[0].t)},100 ${ligne} ${X(pts[pts.length - 1].t)},100" fill="var(--prim-c)"/>
    <polyline points="${ligne}" fill="none" stroke="var(--prim)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
    <circle cx="${X(pts[pts.length - 1].t)}" cy="${Y(pts[pts.length - 1].k)}" r="4" fill="var(--prim)"/></svg>
    <div class="legende" style="justify-content:space-between;margin-top:2px"><span>${fmtJ(jourDe(releves[0].date_releve))} · ${nf(pts[0].k)} km</span><span>${fmtJ(jourDe(releves[releves.length - 1].date_releve))} · ${nf(pts[pts.length - 1].k)} km</span></div>`;
}
