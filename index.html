function photoCarree(f, taille = 480) {
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(f); const img = new Image();
    img.onload = () => { const c = Math.min(img.width, img.height); const cv = document.createElement('canvas'); cv.width = cv.height = Math.min(taille, c);
      cv.getContext('2d').drawImage(img, (img.width - c) / 2, (img.height - c) / 2, c, c, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); ok(cv.toDataURL('image/jpeg', 0.82)); };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error('Image illisible')); };
    img.src = url;
  });
}

  if (o.table === 'ambu_fichiers') return `${d.nom || 'photo'} (${nf((d.taille || 0) / 1024)} ko)`;

function tableDiff(local, serveur) {

  if (!cles.length) return '<p class="aide">Aucune différence de contenu.</p>';

  return `<div class="defile" style="margin-top:6px"><table class="tab diff"><thead><tr><th>Champ</th><th>Saisie de l’appareil</th><th>Version serveur</th></tr></thead><tbody>${cles.map((k) => `<tr><td>${esc(k)}</td><td>${esc(v(local[k]))}</td><td>${esc(v(serveur?.[k]))}</td></tr>`).join('')}</tbody></table></div>`;
}

async function importerCsv(fichier) {
  if (!fichier) return;
  const txt = (await fichier.text()).replace(/^﻿/, ''); const lignes = txt.split(/\r?\n/).filter((l) => l.trim());
  const ent = lignes.shift().split(';').map((x) => x.trim().toLowerCase());
  const col = (l, n) => { const i = ent.indexOf(n); return i >= 0 ? (l[i] || '').trim() : ''; };
  const sites = L('ambu_sites'); let n = 0; const erreurs = [];
  for (const [i, brut] of lignes.entries()) {
    const l = brut.split(';'); const code = col(l, 'code'); const imm = col(l, 'immatriculation'); const site = sites.find((s) => (s.code || '').toLowerCase() === col(l, 'code_site').toLowerCase() || s.nom.toLowerCase() === col(l, 'code_site').toLowerCase());
    if (!code || !imm || !site) { erreurs.push(`ligne ${i + 2}`); continue; }
    if (L('ambu_ambulances').some((a) => a.code.toLowerCase() === code.toLowerCase())) { erreurs.push(`ligne ${i + 2} (${code} existe déjà)`); continue; }
    await enregistrer('ambu_ambulances', null, { code, immatriculation: imm.toUpperCase(), chassis: col(l, 'chassis') || null, marque: col(l, 'marque') || 'Toyota', modele: col(l, 'modele') || null, annee: nombre(col(l, 'annee')), site_id: site.id, km_initial: nombre(col(l, 'km_initial')) || 0, statut: 'disponible',
      equipements: (listes().equipements_defaut || []).map((x) => ({ nom: x, statut: 'ok' })) }, { sansSync: true });
    n++;
  }
  planifierSync(100);
  modale('Import terminé', `<p><b>${n}</b> ambulance(s) importée(s).</p>${erreurs.length ? `<div class="bandeau warn">Lignes ignorées : ${esc(erreurs.join(', '))} (code, immatriculation ou site manquant / inconnu).</div>` : ''}`);
}

function appliquerTheme() { let t = 'auto'; try { t = localStorage.getItem('ambu.theme') || 'auto'; } catch { /* stockage bloqué */ } if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t;

async function changerMdp(m1, m2) {
  if (!m1 || m1.length < 8) throw new Error('8 caractères minimum');
  if (m1 !== m2) throw new Error('Les deux mots de passe sont différents');
  if (!navigator.onLine) throw new Error('Connexion nécessaire pour changer le mot de passe');
  await avecJeton((j) => requete('/auth/v1/user', { methode: 'PUT', corps: { password: m1 }, jeton: j })).catch((e) => { throw new Error(/same|different/i.test(e.message) ? 'Choisissez un mot de passe différent de l’ancien' : /weak|short|least/i.test(e.message) ? 'Mot de passe trop simple' : e.message); });
  await rpc('ambu_mdp_change');
  S.profil = { ...S.profil, doit_changer_mdp: false }; await kvSet('profil', S.profil);
}
async function deconnexion() {
  const n = S.out.length;
  if (!(await confirmer(n ? `${n} saisie(s) ne sont pas encore envoyées. Elles resteront sur cet appareil et partiront à votre prochaine connexion. Se déconnecter ?` : 'Se déconnecter de Ambu Track ?', { ok: 'Se déconnecter', danger: !!n }))) return;
  try { if (navigator.onLine && S.session) await requete('/auth/v1/logout', { methode: 'POST', jeton: S.session.access_token, delai: 5000 }); } catch { /* sans importance */ }
  ecrireSession(null); localStorage.removeItem('ambu.activite'); IDB.fermer(); S.profil = null; S.out = []; TABLES.forEach((t) => { S.srv[t] = new Map(); }); reconstruire();
  ecranConnexion();
}

  const dernier = email || localStorage.getItem('ambu.dernierEmail') || '';
  e.innerHTML = `<div class="boite"><div class="marque"><b>${ic('croix', 24)}</b><h1>Ambu Track</h1></div><p class="aide" style="margin-top:0">Suivi opérationnel des ambulances — Fortescue Belinga</p>
    ${verrou ? '<div class="bandeau warn">Session expirée ou verrouillée : reconnectez-vous. Vos saisies sont conservées sur l’appareil.</div>' : ''}${message ? `<div class="bandeau bad">${esc(message)}</div>` : ''}
    <form id="fl" novalidate><div class="champ"><label class="lib" for="em">E-mail</label><input id="em" type="email" name="email" autocomplete="username" value="${esc(dernier)}" required></div>
    <div class="champ"><label class="lib" for="mp">Mot de passe</label><input id="mp" type="password" name="mdp" autocomplete="current-password" required></div>
    <div class="bandeau bad cache" data-err></div><button class="btn p large" type="submit">Se connecter</button></form>
    <p class="aide" style="margin-top:12px">Mot de passe oublié : contactez l’administrateur Ambu Track. La première connexion nécessite le réseau ; ensuite l’application fonctionne hors ligne.</p>
    ${estInstallee() ? '' : `<button type="button" class="btn large" data-installer-cnx style="margin-top:6px">${ic('installer', 18)} Installer l’application sur ce téléphone</button>`}
    <div class="pied">Version ${CONFIG.VERSION}</div></div>`;
  const f = $('#fl', e); (dernier ? f.mdp : f.email).focus();
  const bic = $('[data-installer-cnx]', e); if (bic) bic.onclick = installerApp;
  f.onsubmit = async (ev) => {
    ev.preventDefault(); const v = lireForm(f); const err = $('[data-err]', e); err.classList.add('cache');
    const montrer = (m) => { err.textContent = m; err.classList.remove('cache'); };
    if (!v.email || !v.mdp) return montrer('Saisissez votre e-mail et votre mot de passe');
    if (!navigator.onLine) return montrer('Pas de réseau : la connexion nécessite Internet.');
    const b = $('button', f); b.disabled = true; b.textContent = 'Connexion…';
    try {
      const r = await requete('/auth/v1/token?grant_type=password', { methode: 'POST', corps: { email: v.email.toLowerCase(), password: v.mdp } });
      localStorage.setItem('ambu.dernierEmail', v.email.toLowerCase());
      ecrireSession({ access_token: r.access_token, refresh_token: r.refresh_token, expires_at: r.expires_at || Math.floor(Date.now() / 1000) + (r.expires_in || 3600), user: { id: r.user.id, email: r.user.email } });
      S.reconnexion = false; S.erreurSync = null;
      await ouvrirDonnees(r.user.id);
      try { await synchroniser(); if (!S.profil) await recevoir(true); }
      catch { /* traité plus bas */ }
      if (!S.profil) { ecrireSession(null); IDB.fermer(); throw new Error(S.erreurSync && /désactivé|inactif|autorisé/.test(S.erreurSync) ? 'Ce compte n’a pas (ou plus) accès à Ambu Track. Contactez l’administrateur.' : 'Chargement des données impossible : ' + (S.erreurSync || 'réessayez')); }
      noterActivite();
      if (S.profil.doit_changer_mdp) return ecranNouveauMdp();
      lancerApp();
    } catch (x) {
      b.disabled = false; b.textContent = 'Se connecter';
      montrer(/invalid/i.test(x.message) ? 'E-mail ou mot de passe incorrect' : x.message);
    }
  };
}
function ecranNouveauMdp() {
  const e = $('#ecran'); e.classList.remove('cache'); $('#app').classList.add('cache');
  e.innerHTML = `<div class="boite"><div class="marque"><b>${ic('croix', 24)}</b><h1>Nouveau mot de passe</h1></div><p class="aide">Bienvenue ${esc(S.profil.nom)}. Pour votre sécurité, choisissez votre mot de passe personnel (8 caractères minimum).</p>
    <form novalidate><div class="champ"><label class="lib">Nouveau mot de passe</label><input type="password" name="m1" autocomplete="new-password"></div><div class="champ"><label class="lib">Confirmer</label><input type="password" name="m2" autocomplete="new-password"></div><div class="bandeau bad cache" data-err></div><button class="btn p large">Valider</button></form></div>`;
  $('form', e).onsubmit = async (ev) => { ev.preventDefault(); const v = lireForm(ev.target);
    try { await changerMdp(v.m1, v.m2); toast('Mot de passe enregistré', 'ok'); lancerApp(); } catch (x) { const d = $('[data-err]', e); d.textContent = x.message; d.classList.remove('cache'); } };
}
async function ouvrirDonnees(uid) {
  IDB.fermer(); await IDB.ouvrir('ambutrack-' + uid);
  TABLES.forEach((t) => { S.srv[t] = new Map(); });
  for (const l of await IDB.tous('lignes')) if (S.srv[l.t]) S.srv[l.t].set(l.r.id, l.r);
  S.out = (await IDB.tous('outbox')).map(({ k, ...o }) => o);
  S.profil = (await kvGet('profil')) || null; S.dernierPull = (await kvGet('dernierPull')) || null; S.derniereSync = (await kvGet('derniereSync')) || null; S.itin = (await kvGet('itin')) || {};
  reconstruire();
}
function noterActivite() { localStorage.setItem('ambu.activite', String(Date.now())); }
function inactiviteDepassee() { const t = Number(localStorage.getItem('ambu.activite') || 0); return t && Date.now() - t > (seuils().session_heures || 12) * 3600000; }
function verrouiller() { ecrireSession(null); S.reconnexion = false; ecranConnexion({ verrou: true, email: localStorage.getItem('ambu.dernierEmail') }); }
let lance = false;
function lancerApp() {
  $('#ecran').classList.add('cache'); $('#app').classList.remove('cache');
  $('#btnMenu').innerHTML = ic('menu', 24); $('.logo b').innerHTML = ic('croix', 16);
  if (!lance) {
    lance = true;
    window.addEventListener('hashchange', () => router());
    window.addEventListener('online', () => { majIndicateur(); planifierSync(500); });
    window.addEventListener('offline', majIndicateur);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.session) { if (inactiviteDepassee()) return verrouiller(); planifierSync(300); } });
    ['click', 'keydown', 'touchstart'].forEach((ev) => document.addEventListener(ev, () => { if (S.session) noterActivite(); }, { passive: true }));
    setInterval(() => { if (!S.session) return; if (inactiviteDepassee()) return verrouiller(); if (navigator.onLine && !S.sync) synchroniser(); }, 60000);
    $('#pillSync').onclick = () => { location.hash = '#/sync'; };
    $('#voile').onclick = () => basculerMenu(false);
    $('#btnMenu').onclick = () => basculerMenu(!$('#nav').classList.contains('ouvert'));
  }
  router(); planifierSync(200);
}
let demandeMaj = false;
function enregistrerSW() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  navigator.serviceWorker.register('sw.js').then((reg) => {
    const proposer = (w) => { if (!w || $('.maj')) return; const d = document.createElement('div'); d.className = 'maj'; d.innerHTML = 'Nouvelle version disponible <button>Mettre à jour</button>'; document.body.appendChild(d);
      $('button', d).onclick = async () => { demandeMaj = true; await persisterTout().catch(() => {}); w.postMessage('activer'); }; };
    if (reg.waiting && navigator.serviceWorker.controller) proposer(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) proposer(w); }); });
    setInterval(() => reg.update().catch(() => {}), 3600000);
  }).catch(() => {});
  // Rechargement uniquement à la demande de l'utilisateur (jamais pendant une saisie, ni à la 1re installation)
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (demandeMaj) { demandeMaj = false; location.reload(); } });
}
async function persisterTout() { for (const o of S.out) await persisterOp(o); }
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); window.__installer = e; });
window.addEventListener('appinstalled', () => { window.__installer = null; if (S.profil) { dessinerNav(); router(true); } });

async function demarrer() {
  appliquerTheme(); enregistrerSW();
  const sess = lireSession();
  if (!sess) return ecranConnexion();
  S.session = sess;
  try { await ouvrirDonnees(sess.user.id); } catch (e) { return ecranConnexion({ message: 'Stockage local indisponible : ' + e.message }); }
  if (inactiviteDepassee()) return verrouiller();
  if (!S.profil) {
    try { await recevoir(true); } catch (e) { ecrireSession(null); return ecranConnexion({ message: e.reseau ? 'Première connexion : le réseau est nécessaire pour télécharger les données.' : e.message }); }
  }
  if (S.profil.doit_changer_mdp && navigator.onLine) return ecranNouveauMdp();
  noterActivite(); lancerApp();
}
window.__ambu = { S, synchroniser, calculMission, kmCourant, alertes, IDB };   // pour les tests automatiques
demarrer();
</script>
