<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3a59"/>
      <stop offset="1" stop-color="#0f1e2e"/>
    </linearGradient>
    <linearGradient id="caisse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8ef"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#fond)"/>
  <ellipse cx="256" cy="378" rx="188" ry="13" fill="#000" opacity=".3"/>
  <!-- Ambulance de type Land Cruiser série 70 (cellule longue), vue de profil -->
  <g transform="translate(22 14) scale(0.92)">
    <!-- rampe de gyrophares -->
    <rect x="200" y="132" width="48" height="24" rx="7" fill="#ff3b30"/>
    <rect x="248" y="132" width="48" height="24" rx="7" fill="#2f80ed"/>
    <rect x="196" y="153" width="104" height="8" rx="3" fill="#cfd8e3"/>
    <!-- caisse arrière haute + cabine + capot carré -->
    <path d="M58 330 V174 Q58 160 72 160 H344 Q354 160 358 169 L382 226 H446 Q458 226 462 238 L468 252 V330 Z" fill="url(#caisse)"/>
    <!-- vitre de cabine -->
    <path d="M296 176 H338 Q344 176 347 182 L365 220 H296 Z" fill="#1d3b5e"/>
    <path d="M310 176 L296 220" stroke="#2c557d" stroke-width="5"/>
    <!-- lignes de portes -->
    <path d="M286 170 V318 M376 228 V318 M210 170 V318" stroke="#c3ccd7" stroke-width="4" fill="none"/>
    <!-- rétroviseur -->
    <rect x="368" y="200" width="10" height="22" rx="3" fill="#2b3440"/>
    <!-- snorkel le long du montant -->
    <path d="M388 232 V146 Q388 134 400 134 H414" fill="none" stroke="#2b3440" stroke-width="11" stroke-linecap="round"/>
    <!-- décoration ambulance : bande rouge et liseré bleu -->
    <rect x="58" y="256" width="410" height="24" fill="#d42b1f"/>
    <rect x="58" y="282" width="410" height="7" fill="#2f80ed"/>
    <!-- croix sanitaire -->
    <rect x="124" y="180" width="26" height="66" rx="4" fill="#d42b1f"/>
    <rect x="104" y="200" width="66" height="26" rx="4" fill="#d42b1f"/>
    <!-- phare rond et pare-chocs -->
    <circle cx="458" cy="242" r="8" fill="#ffd34d"/>
    <rect x="442" y="318" width="40" height="18" rx="5" fill="#2b3440"/>
    <!-- bas de caisse et marchepied -->
    <rect x="58" y="312" width="410" height="18" fill="#c4ced9"/>
    <rect x="220" y="330" width="96" height="8" rx="3" fill="#2b3440"/>
    <!-- élargisseurs d'ailes -->
    <path d="M80 336 A58 58 0 0 1 196 336" fill="none" stroke="#2b3440" stroke-width="14"/>
    <path d="M334 336 A58 58 0 0 1 450 336" fill="none" stroke="#2b3440" stroke-width="14"/>
    <!-- roues -->
    <circle cx="138" cy="340" r="46" fill="#111821"/>
    <circle cx="138" cy="340" r="23" fill="#a9b6c5"/>
    <circle cx="138" cy="340" r="8" fill="#2b3440"/>
    <circle cx="392" cy="340" r="46" fill="#111821"/>
    <circle cx="392" cy="340" r="23" fill="#a9b6c5"/>
    <circle cx="392" cy="340" r="8" fill="#2b3440"/>
  </g>
</svg>
